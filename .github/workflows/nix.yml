name: Nix

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  nix:
    name: Nix / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Install Cachix
        uses: cachix/cachix-action@v16
        with:
          name: YOUR_CACHE_NAME
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Check flake
        run: nix flake check ./nix

      - name: Check formatting
        run: nix fmt ./nix -- --check

      - name: Build development environment
        run: nix develop ./nix --command true

      - name: Build package
        run: nix build ./nix

      - name: Show package
        run: nix path-info ./nix