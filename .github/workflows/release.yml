name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  package:
    name: Package ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            platform: linux-x64
            arch: x64
            archive_glob: build/*.tar.gz
            cpack_generator: TGZ
          - os: windows-2025
            platform: windows-x64
            arch: x64
            archive_glob: build/*.exe
            cpack_generator: NSIS
          - os: macos-26-intel
            platform: macos-x64
            arch: x64
            archive_glob: build/*.tar.gz
            cpack_generator: TGZ
          - os: ubuntu-26.04-arm
            platform: linux-arm64
            arch: ARM64
            archive_glob: build/*.tar.gz
            cpack_generator: TGZ
          - os: windows-11-vs2026-arm
            platform: windows-arm64
            arch: ARM64
            archive_glob: build/*.exe
            cpack_generator: NSIS
          - os: macos-26
            platform: macos-arm64
            arch: ARM64
            archive_glob: build/*.tar.gz
            cpack_generator: TGZ

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install vcpkg dependencies
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'
          vcpkgJsonGlob: '**/vcpkg.json'

      - name: Prepare tag metadata
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Install OpenMP dependencies (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install libomp
          echo "OpenMP_ROOT=$(brew --prefix libomp)" >> "$GITHUB_ENV"


      - name: Install autoconf-archive dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf autoconf-archive automake libtool ninja-build

      - name: Configure CMake
        shell: bash
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="${GITHUB_WORKSPACE}/vcpkg/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        shell: bash
        run: |
          cmake --build build --parallel

      - name: Package with CPack
        shell: bash
        run: |
          cd build
          cpack -G "${{ matrix.cpack_generator }}"
          ls -1

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: sorting-visualizer-${{ github.ref_name }}-${{ matrix.platform }}
          path: ${{ matrix.archive_glob }}
          if-no-files-found: error

  nix-release:
    name: Nix Release
    runs-on: ubuntu-latest
    needs: package

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Install Cachix
        uses: cachix/cachix-action@v17
        with:
          name: sorting-visualizer
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build Nix package
        run: |
          nix build ./nix --no-link --print-out-paths | cachix push sorting-visualizer

      - name: Export Nix closure
        run: |
          nix build ./nix --no-link --print-out-paths > nix-output.txt
          OUT_PATH="$(cat nix-output.txt)"
          nix-store -qR "$OUT_PATH" | grep -v '\.drv$' > nix-closure.txt
          nix-store --export $(cat nix-closure.txt) | gzip -9 > sorting-visualizer-${{ github.ref_name }}-nix-closure.nar.gz

      - name: Upload Nix closure
        uses: actions/upload-artifact@v7
        with:
          name: sorting-visualizer-${{ github.ref_name }}-nix
          path: sorting-visualizer-${{ github.ref_name }}-nix-closure.nar.gz

  github-release:
    name: Publish GitHub Release
    needs:
      - package
      - nix-release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: release-artifacts/**/*
          generate_release_notes: true
