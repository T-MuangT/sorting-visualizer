name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_type: [Debug, Release]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install vcpkg dependencies
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'
          vcpkgJsonGlob: '**/vcpkg.json'

      - name: Diagnose vcpkg manifest (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "Working directory: $PWD"
          Get-ChildItem -Force
          Get-ChildItem -Path . -Filter vcpkg.json -Recurse |
          ForEach-Object {
            Write-Host "`nManifest: $($_.FullName)"
            Get-Content $_.FullName
          }

      - name: Diagnose vcpkg manifest (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          echo "Working directory: $PWD"
          echo ""
          echo "=== Repository files ==="
          ls -la

          echo ""
          echo "=== vcpkg manifests ==="
          find . -name vcpkg.json -not -path './vcpkg/buildtrees/*' \
            -not -path './vcpkg/packages/*' \
            -not -path './build/vcpkg_installed/*' \
            -print -exec cat {} \;

          echo ""
          echo "=== vcpkg configuration ==="
          if [ -f vcpkg-configuration.json ]; then
            cat vcpkg-configuration.json
          else
            echo "No vcpkg-configuration.json at repository root."
          fi

          echo ""
          echo "=== Installed wxWidgets version ==="
          for file in \
            build/vcpkg_installed/arm64-osx/share/wxwidgets/vcpkg.json \
            build/vcpkg_installed/x64-linux/share/wxwidgets/vcpkg.json
          do
            if [ -f "$file" ]; then
              echo "--- $file"
              cat "$file"
            fi
          done

          echo ""
          echo "=== Installed NanoSVG package files ==="
          find build/vcpkg_installed \
            -iname '*nanosvg*' -print 2>/dev/null || true

      - name: Install OpenMP dependencies (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install libomp
          echo "OpenMP_ROOT=$(brew --prefix libomp)" >> "$GITHUB_ENV"

      - name: Install build tool dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf autoconf-archive automake libtool ninja-build libltdl-dev

      - name: Diagnose wxWidgets and NanoSVG (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          echo "=== vcpkg baseline ==="
          grep -A 2 '"builtin-baseline"' vcpkg.json

          echo ""
          echo "=== Installed wxWidgets version ==="
          cat build/vcpkg_installed/arm64-osx/share/wxwidgets/vcpkg.json

          echo ""
          echo "=== Installed NanoSVG package metadata ==="
          find build/vcpkg_installed/arm64-osx/share \
            -iname '*nanosvg*' -print

          echo ""
          echo "=== NanoSVG CMake references ==="
          grep -R -n -E \
            'NanoSVG::nanosvg|NanoSVG::nanosvgrast|nsvgCreateRasterizer' \
            build/vcpkg_installed/arm64-osx/share \
            2>/dev/null || true

          echo ""
          echo "=== wxWidgets port version in vcpkg registry ==="
          cat vcpkg/versions/w-/wxwidgets.json

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 18 2026" -A x64 -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake"

      - name: Configure CMake (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DOpenMP_ROOT="${OpenMP_ROOT:-}" -DCMAKE_TOOLCHAIN_FILE="${GITHUB_WORKSPACE}/vcpkg/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure -C ${{ matrix.build_type }}