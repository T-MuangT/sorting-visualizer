name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish (for example v2.0.0)
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  package:
    name: Package ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            platform: linux-x64
            arch: x64
            cpack_generators: "TGZ"
            artifact_paths: |
              build/*.tar.gz

          - os: ubuntu-26.04-arm
            platform: linux-arm64
            arch: ARM64
            cpack_generators: "TGZ"
            artifact_paths: |
              build/*.tar.gz

          - os: windows-2025
            platform: windows-x64
            arch: x64
            cpack_generators: "NSIS ZIP"
            artifact_paths: |
              build/*.exe
              build/*.zip

          # Temporary removal until fixed
          #- os: windows-11-arm
          #  platform: windows-arm64
          #  arch: ARM64
          #  cpack_generators: "NSIS ZIP"
          #  artifact_paths: |
          #    build/*.exe
          #    build/*.zip

          - os: macos-26-intel
            platform: macos-x64
            arch: x64
            cpack_generators: "DragNDrop TGZ"
            artifact_paths: |
              build/*.dmg
              build/*.tar.gz

          - os: macos-26
            platform: macos-arm64
            arch: ARM64
            cpack_generators: "DragNDrop TGZ"
            artifact_paths: |
              build/*.dmg
              build/*.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Prepare release metadata
        shell: bash
        run: |
          VERSION="${RELEASE_TAG#v}"

          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

          echo "Release tag: ${RELEASE_TAG}"
          echo "Release version: ${VERSION}"
          echo "Platform: ${{ matrix.platform }}"

      # Windows: wxWidgets and other manifest dependencies from vcpkg.
      - name: Install vcpkg dependencies (Windows)
        if: runner.os == 'Windows'
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'
          vcpkgJsonGlob: '**/vcpkg.json'

      # Windows: install both CPack installer backends.
      - name: Install Windows packaging tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress

          echo "$env:USERPROFILE\.dotnet\tools" >> $env:GITHUB_PATH

      # macOS: native wxWidgets 3.2 and OpenMP.
      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install wxwidgets@3.2 libomp

          echo "OpenMP_ROOT=$(brew --prefix libomp)" >> "$GITHUB_ENV"
          echo "WXWIDGETS_ROOT=$(brew --prefix wxwidgets@3.2)" >> "$GITHUB_ENV"

      # Linux: native wxWidgets 3.2 and RPM packaging tools.
      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build libwxgtk3.2-dev

      # Windows x64: keep the passing Visual Studio generator configuration.
      - name: Configure CMake (Windows x64)
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 18 2026" -A x64 -DCPACK_WIX_VERSION=4 -DSORTING_VISUALIZER_VERSION="${{ env.VERSION }}" -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake"

      # Windows ARM64: use Ninja on the native ARM runner instead of the Visual
      # Studio generator, and select the matching vcpkg target triplet.
      - name: Configure CMake (Windows ARM64)
        if: matrix.platform == 'windows-arm64'
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVCPKG_TARGET_TRIPLET=arm64-windows -DCPACK_WIX_VERSION=4 -DSORTING_VISUALIZER_VERSION="${{ env.VERSION }}" -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake"

      # Linux: native APT wxWidgets; no vcpkg toolchain.
      - name: Configure CMake (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSORTING_VISUALIZER_VERSION="$VERSION"

      # macOS: native Homebrew wxWidgets; no vcpkg toolchain.
      - name: Configure CMake (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DOpenMP_ROOT="$OpenMP_ROOT" -DCMAKE_PREFIX_PATH="$WXWIDGETS_ROOT" -DSORTING_VISUALIZER_VERSION="$VERSION"

      - name: Build
        run: cmake --build build --config Release --parallel

      # Linux and macOS: create every requested archive/package.
      - name: Package (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cd build

          for generator in ${{ matrix.cpack_generators }}; do
            echo "Packaging with ${generator}"
            cpack -G "$generator"
          done

          echo "=== Generated packages ==="
          ls -lh

      # Windows: create both NSIS and WiX installers.
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location build

          $generators = "${{ matrix.cpack_generators }}".Split(
            " ",
            [System.StringSplitOptions]::RemoveEmptyEntries
          )

          foreach ($generator in $generators) {
            Write-Host "Packaging with $generator"
            cpack -G $generator

            if ($LASTEXITCODE -ne 0) {
              throw "CPack failed with generator $generator"
            }
          }

          Get-ChildItem -File

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sorting-visualizer-${{ env.RELEASE_TAG }}-${{ matrix.platform }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error
          compression-level: 0

  nix-release:
    name: Nix Release
    runs-on: ubuntu-latest
    needs: package

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Install Cachix
        uses: cachix/cachix-action@v17
        with:
          name: sorting-visualizer
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build Nix package and push to Cachix
        run: |
          nix build ./nix --no-link --print-out-paths \
            | cachix push sorting-visualizer

      - name: Export Nix closure
        shell: bash
        run: |
          set -euo pipefail

          nix build ./nix --no-link --print-out-paths > nix-output.txt
          OUT_PATH="$(cat nix-output.txt)"

          nix-store -qR "$OUT_PATH" \
            | grep -v '\.drv$' > nix-closure.txt

          nix-store --export $(cat nix-closure.txt) \
            | gzip -9 \
            > "sorting-visualizer-${RELEASE_TAG}-nix-closure.nar.gz"

      - name: Upload Nix closure
        uses: actions/upload-artifact@v7
        with:
          name: sorting-visualizer-${{ env.RELEASE_TAG }}-nix
          path: sorting-visualizer-${{ env.RELEASE_TAG }}-nix-closure.nar.gz
          if-no-files-found: error

  github-release:
    name: Publish GitHub Release
    needs:
      - package
      - nix-release

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Release ${{ env.RELEASE_TAG }}
          files: release-artifacts/**/*
          generate_release_notes: true
