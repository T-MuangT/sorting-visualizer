name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  package:
    name: Package ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            archive_glob: build/*.tar.gz
            cpack_generator: TGZ
          - os: windows-latest
            platform: windows-x64
            archive_glob: build/*.zip
            cpack_generator: ZIP
          - os: macos-latest
            platform: macos-x64
            archive_glob: build/*.tar.gz
            cpack_generator: TGZ

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare tag metadata
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Install OpenMP dependencies (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install libomp
          echo "CMAKE_PREFIX_PATH=/opt/homebrew/opt/libomp:/usr/local/opt/libomp:${CMAKE_PREFIX_PATH}" >> "$GITHUB_ENV"
          echo "CPPFLAGS=-I/opt/homebrew/opt/libomp/include -I/usr/local/opt/libomp/include ${CPPFLAGS}" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L/opt/homebrew/opt/libomp/lib -L/usr/local/opt/libomp/lib ${LDFLAGS}" >> "$GITHUB_ENV"

      - name: Configure CMake
        shell: bash
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: bash
        run: |
          cmake --build build --parallel

      - name: Package with CPack
        shell: bash
        run: |
          cd build
          cpack -G "${{ matrix.cpack_generator }}"
          ls -1

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: sorting-visualizer-${{ github.ref_name }}-${{ matrix.platform }}
          path: ${{ matrix.archive_glob }}
          if-no-files-found: error

  nix-release:
    name: Nix Release
    runs-on: ubuntu-latest
    needs: package

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Install Cachix
        uses: cachix/cachix-action@v16
        with:
          name: YOUR_CACHE_NAME
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build Nix package
        run: |
          nix build ./nix \
            --no-link \
            --print-out-paths \
            | cachix push YOUR_CACHE_NAME

      - name: Export Nix closure
        run: |
          nix build ./nix \
            --no-link \
            --print-out-paths > nix-output.txt

          OUT_PATH="$(cat nix-output.txt)"

          nix-store -qR "$OUT_PATH" \
            | grep -v '\.drv$' \
            > nix-closure.txt

          nix-store --export $(cat nix-closure.txt) \
            | gzip -9 > sorting-visualizer-${{ github.ref_name }}-nix-closure.nar.gz

      - name: Upload Nix closure
        uses: actions/upload-artifact@v4
        with:
          name: sorting-visualizer-${{ github.ref_name }}-nix
          path: sorting-visualizer-${{ github.ref_name }}-nix-closure.nar.gz

  github-release:
    name: Publish GitHub Release
    needs:
      - package
      - nix-release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: release-artifacts/**/*
          generate_release_notes: true
