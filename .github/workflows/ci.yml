name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_type: [Debug, Release]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install OpenMP dependencies (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install libomp
          echo "CMAKE_PREFIX_PATH=/opt/homebrew/opt/libomp:/usr/local/opt/libomp:${CMAKE_PREFIX_PATH}" >> "$GITHUB_ENV"
          echo "CPPFLAGS=-I/opt/homebrew/opt/libomp/include -I/usr/local/opt/libomp/include ${CPPFLAGS}" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L/opt/homebrew/opt/libomp/lib -L/usr/local/opt/libomp/lib ${LDFLAGS}" >> "$GITHUB_ENV"

      - name: Configure CMake
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure -C ${{ matrix.build_type }}
